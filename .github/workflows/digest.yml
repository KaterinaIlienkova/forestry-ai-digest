name: Weekly Forestry AI Digest

on:
  schedule:
    # Запуск щопонеділка о 07:00 UTC (09:00 / 10:00 за фінським часом)
    - cron: '0 7 * * 1'
  workflow_dispatch: # Дозволяє запускати вручну кнопкою

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4

      - name: Встановлення Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановлення бібліотек
        run: pip install -r requirements.txt

      - name: Запуск AI-дайджесту
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        run: python main.py